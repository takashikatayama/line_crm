<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINE Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; }
    h2 { font-size: 1rem; margin-bottom: 10px; color: #555; }
    .stat { font-size: 2.5rem; font-weight: 700; color: #06c755; margin-bottom: 4px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #eee; color: #888; font-weight: 600; }
    td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
    tr:last-child td { border-bottom: none; }
    .empty { color: #aaa; font-size: .875rem; padding: 12px 0; }
    .refresh { float: right; font-size: .8rem; color: #aaa; }
  </style>
</head>
<body>
  <h1>LINE Dashboard <span class="refresh" id="updated"></span></h1>

  <div class="card">
    <h2>Followers</h2>
    <div class="stat" id="follower-count">—</div>
  </div>

  <div class="card">
    <h2>Customer List</h2>
    <div id="customers"><p class="empty">Loading…</p></div>
  </div>

  <div class="card">
    <h2>Message Log (last 100)</h2>
    <div id="messages"><p class="empty">Loading…</p></div>
  </div>

  <script>
    function fmt(ts) {
      return new Date(ts).toLocaleString();
    }

    function renderTable(headers, rows, emptyText) {
      if (!rows.length) return `<p class="empty">${emptyText}</p>`;
      const ths = headers.map(h => `<th>${h}</th>`).join('');
      const trs = rows.map(r => `<tr>${r.map(c => `<td>${c ?? '—'}</td>`).join('')}</tr>`).join('');
      return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
    }

    async function load() {
      try {
        const { followerCount, customers, messages } = await fetch('/api/stats').then(r => r.json());

        document.getElementById('follower-count').textContent = followerCount;

        document.getElementById('customers').innerHTML = renderTable(
          ['User ID', 'Display Name', 'Followed At'],
          customers.map(c => [c.user_id, c.display_name, fmt(c.followed_at)]),
          'No followers yet.'
        );

        document.getElementById('messages').innerHTML = renderTable(
          ['User ID', 'Message', 'Time'],
          messages.map(m => [m.user_id, m.text, fmt(m.timestamp)]),
          'No messages yet.'
        );

        document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error(e);
      }
    }

    load();
    setInterval(load, 10000); // auto-refresh every 10 s
  </script>
</body>
</html>
